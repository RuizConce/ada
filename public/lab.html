<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0f14">
  <title>Laboratorio de voz · ADA</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { background: var(--fondo); }
    .lab { max-width: 640px; margin: 0 auto; padding: 14px 16px 40px; display: grid; gap: 14px; }
    .lab-cab { display: flex; align-items: center; gap: 10px; }
    .lab-cab a { color: var(--texto-suave); text-decoration: none; font-size: 22px; padding: 4px 10px; border: 1px solid var(--borde); border-radius: 12px; }
    .lab-cab h1 { margin: 0; font-size: 20px; }
    .tarjeta-lab { padding: 14px; border-radius: 16px; border: 1px solid var(--borde); background: var(--vidrio); }
    .modos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .modos button { padding: 10px 6px; border-radius: 12px; border: 1px solid var(--borde); background: none; font-size: 13px; line-height: 1.3; }
    .modos button[aria-pressed="true"] { border-color: var(--verde); background: rgba(94, 234, 168, 0.1); color: #fff; }
    .modos small { display: block; color: var(--texto-suave); font-size: 11px; }
    #lab-desc { margin: 10px 0 0; font-size: 14px; color: var(--texto-suave); line-height: 1.45; }
    .lab-orbe { display: grid; place-items: center; gap: 10px; padding: 8px 0; }
    #lab-boton { width: 150px; height: 150px; border-radius: 50%; border: 0; font-weight: 700; font-size: 16px; color: #04140d; background: radial-gradient(circle at 30% 30%, var(--verde), var(--verde-2)); box-shadow: 0 10px 40px -10px rgba(94, 234, 168, 0.6); }
    #lab-boton.activo { background: radial-gradient(circle at 30% 30%, #fca5a5, #ef4444); color: #fff; }
    #lab-boton.hablando { box-shadow: 0 0 0 6px rgba(56, 189, 248, 0.35), 0 10px 40px -10px rgba(56, 189, 248, 0.7); }
    #lab-fase { color: var(--texto-suave); font-size: 14px; min-height: 1.4em; text-align: center; }
    .linea { margin: 6px 0; font-size: 15px; line-height: 1.45; }
    .linea.yo { color: var(--texto-suave); font-style: italic; }
    .linea.parcial { opacity: 0.6; }
    #lab-transcripcion { max-height: 34dvh; overflow-y: auto; }
    #lab-detalle:empty, #lab-docs:empty { display: none; }
    #lab-detalle { margin-top: 8px; font-size: 14px; }
    .metricas { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
    .metricas div { padding: 8px; border-radius: 12px; background: var(--fondo); border: 1px solid var(--borde); }
    .metricas strong { display: block; font-size: 18px; }
    .metricas span { font-size: 11px; color: var(--texto-suave); }
    .notas { display: grid; gap: 10px; }
    .nota-fila { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 14px; }
    .estrellas { display: flex; gap: 4px; }
    .estrellas button { width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--borde); background: none; font-size: 15px; }
    .estrellas button[aria-pressed="true"] { background: var(--verde); color: #04140d; border-color: var(--verde); }
    #lab-comentario { width: 100%; min-height: 60px; padding: 10px; border-radius: 12px; border: 1px solid var(--borde); background: var(--fondo); color: var(--texto); font: inherit; }
    #lab-guardar { padding: 12px; border-radius: 12px; border: 0; font-weight: 700; color: #04140d; background: linear-gradient(90deg, var(--verde), var(--verde-2)); }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 6px 4px; border-bottom: 1px solid var(--borde); text-align: left; }
    th { color: var(--texto-suave); font-weight: 500; }
    td:not(:first-child), th:not(:first-child) { text-align: right; }
    .error { color: #fca5a5; font-size: 14px; }
    .claves { font-size: 13px; color: var(--texto-suave); }
  </style>
</head>
<body>
  <main class="lab">
    <header class="lab-cab">
      <a href="/" aria-label="Volver a ADA">‹</a>
      <h1>Laboratorio de voz</h1>
    </header>

    <section class="tarjeta-lab">
      <div class="modos" role="group" aria-label="Modo">
        <button type="button" data-modo="A" aria-pressed="true">A · Tiempo real<small>Claude de cerebro</small></button>
        <button type="button" data-modo="B" aria-pressed="false">B · Voz a voz<small>con ADA detrás</small></button>
        <button type="button" data-modo="actual" aria-pressed="false">Actual<small>para calificar</small></button>
      </div>
      <p id="lab-desc"></p>
      <p id="lab-claves" class="claves"></p>
    </section>

    <section class="tarjeta-lab">
      <div class="lab-orbe">
        <button id="lab-boton" type="button">Empezar</button>
        <p id="lab-fase">Elige un modo y toca Empezar.</p>
      </div>
      <div id="lab-transcripcion"></div>
      <div id="lab-detalle" class="detalle"></div>
      <div id="lab-docs" class="meta"></div>
      <p id="lab-error" class="error"></p>
    </section>

    <section class="tarjeta-lab">
      <div class="metricas">
        <div><strong id="m-turnos">0</strong><span>turnos</span></div>
        <div><strong id="m-ultima">—</strong><span>demora última</span></div>
        <div><strong id="m-mediana">—</strong><span>demora mediana</span></div>
      </div>
      <p class="meta" style="margin:8px 0 0">Demora = desde que terminas de hablar hasta que ADA empieza a sonar.</p>
    </section>

    <section class="tarjeta-lab">
      <h2 style="margin:0 0 10px;font-size:16px">Califica esta sesión</h2>
      <div class="notas">
        <div class="nota-fila"><span>Naturalidad</span><div class="estrellas" data-nota="naturalidad"></div></div>
        <div class="nota-fila"><span>Me entendió</span><div class="estrellas" data-nota="comprension"></div></div>
        <div class="nota-fila"><span>Me sirvió</span><div class="estrellas" data-nota="utilidad"></div></div>
        <textarea id="lab-comentario" placeholder="¿Qué te gustó o qué falló?"></textarea>
        <button id="lab-guardar" type="button">Guardar calificación</button>
      </div>
    </section>

    <section class="tarjeta-lab">
      <h2 style="margin:0 0 10px;font-size:16px">Comparación</h2>
      <div id="lab-resultados" class="meta">Aún no hay sesiones calificadas.</div>
    </section>
  </main>
  <script src="lab.js"></script>
</body>
</html>
